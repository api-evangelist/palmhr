aid: palmhr
name: Palm HR
description: >-
  Palm HR (palm.hr, operating on palmhr.net) is an HR management and payroll
  platform built specifically for the UAE and broader MENA region, trusted by
  organizations from startups to enterprises for local labor-law and WPS
  compliance. The platform spans people management (employee profiles,
  onboarding and offboarding, document management), attendance and time
  tracking (mobile check-in/out, timesheets, shift scheduling, project time),
  payroll automation (WPS-compliant processing, expenses, loans, multi-country
  and multi-currency), performance management, and recruiting, plus an
  outsourced-HR service. Palm HR exposes REST APIs with API keys carrying
  granular permissions so customers can push data to ERPs and external tools,
  and ships prebuilt integrations with accounting suites (Xero, QuickBooks,
  Zoho Books, Dynamics 365, NetSuite, Wafeq, Qoyod, Odoo, Tally), biometric
  devices (ZKTeco, CAMS), and automation platforms (Zapier, Make, Power
  Automate). The company is a portfolio company of Speedinvest. This profile
  was enriched from public web surfaces; no public OpenAPI specification or
  developer portal was discovered.
